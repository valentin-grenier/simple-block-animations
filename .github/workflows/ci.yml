name: CI

# Contrôles qualité lancés sur chaque PR et sur main : standards PHP (WPCS +
# PHPCompatibilityWP via `composer phpcs`), lint JS et CSS, build de production.
# Ne déploie rien et n'utilise aucun secret.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP coding standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # PHP et Composer sont préinstallés sur ubuntu-latest : pas d'action tierce.
      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress

      - name: Run PHPCS
        run: composer phpcs

  assets:
    name: Lint and build assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # npm install (et non npm ci) : aucun package-lock.json n'est commité.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint JavaScript
        run: npm run lint:js

      - name: Lint styles
        run: npm run lint:css

      - name: Build production assets
        run: npm run build
